[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vyro-ai-voice-studio"
version = "1.0.0"
description = "Independent, local-first voice synthesis and audio QA component for VYRO MEDIA."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
dependencies = ["pydantic>=2.7,<3", "numpy>=1.26,<3", "soundfile>=0.12,<1", "python-dotenv>=1,<2", "typer>=0.12,<1", "rich>=13,<15"]

[project.optional-dependencies]
engine = ["voxcpm"]
asr = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<9", "ruff>=0.5,<1", "mypy>=1.10,<2"]

[project.scripts]
vyro-voice = "vyro_ai_voice_studio.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
